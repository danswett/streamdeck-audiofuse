<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Preset recall settings</title>
		<link rel="stylesheet" href="inspector.css" />
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Slot">
			<sdpi-select setting="slot" default="1">
				<option value="1">Slot 1</option>
				<option value="2">Slot 2</option>
				<option value="3">Slot 3</option>
				<option value="4">Slot 4</option>
				<option value="5">Slot 5</option>
				<option value="6">Slot 6</option>
				<option value="7">Slot 7</option>
				<option value="8">Slot 8</option>
			</sdpi-select>
		</sdpi-item>
		<p class="hint">
			AudioFuse 16Rig only. The key shows the slot's stored name, and marks
			the loaded slot with an asterisk when the device has unsaved edits.
		</p>
		<p class="hint">
			Recalling a slot rewrites most of the device state, including monitor
			volume and mute.
		</p>
	</body>
</html>
